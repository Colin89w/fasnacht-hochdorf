name: Anmeldungen wiederherstellen (einmalig)

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Komma-getrennte Vereinsname-Teilstrings zum Wiederherstellen. LEER lassen, um nur aufzulisten (nichts anlegen).'
        required: false
        default: ''

jobs:
  recover-pending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: node scripts/recover-pending.js
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
          EMAIL_SUBJECT_FILTER: ${{ secrets.EMAIL_SUBJECT_FILTER }}
          EMAIL_SINCE_DATE: ${{ secrets.EMAIL_SINCE_DATE }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          RECOVER_FILTER: ${{ inputs.filter }}
